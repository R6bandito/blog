<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="petal" cx="50%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#ffd6ea"/>
      <stop offset="70%" stop-color="#ff9acb"/>
      <stop offset="100%" stop-color="#f77eb8"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6fb"/>
      <stop offset="100%" stop-color="#ffe3f1"/>
    </radialGradient>
  </defs>
  <!-- 五片花瓣：紧凑饱满 -->
  <g fill="url(#petal)">
    <ellipse cx="32" cy="13" rx="10.2" ry="12.8" transform="rotate(0 32 32)"/>
    <ellipse cx="32" cy="13" rx="10.2" ry="12.8" transform="rotate(72 32 32)"/>
    <ellipse cx="32" cy="13" rx="10.2" ry="12.8" transform="rotate(144 32 32)"/>
    <ellipse cx="32" cy="13" rx="10.2" ry="12.8" transform="rotate(216 32 32)"/>
    <ellipse cx="32" cy="13" rx="10.2" ry="12.8" transform="rotate(288 32 32)"/>
  </g>
  <!-- 花心 -->
  <circle cx="32" cy="32" r="7" fill="url(#core)"/>
  <!-- 花蕊 -->
  <g fill="#ffce57">
    <circle cx="28.4" cy="29.8" r="1.5"/>
    <circle cx="35.6" cy="29.8" r="1.5"/>
    <circle cx="32" cy="35.6" r="1.5"/>
    <circle cx="36.8" cy="34.2" r="1.5"/>
    <circle cx="27.2" cy="34.2" r="1.5"/>
  </g>
</svg>
